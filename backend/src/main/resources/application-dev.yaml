server:
  port: ${SERVER_PORT:8081}

website:
  url: http://localhost:4200

email:
  code:
    validation:
      time: ${CODE_VALIDATION_TIME:10m}

security:
  api:
    key: ${API_KEY:password}
  jwt:
    token:
      issuer: ${TOKEN_ISSUER:tecflix}
      secret: ${TOKEN_SECRET:mySecret}
      duration: ${TOKEN_DURATION:15m}
      refresh:
        duration: ${REFRESH_TOKEN_DURATION:168h}

spring:
  application:
    name: tecflix-app
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:2345/tecflixapp_db}
    username: ${DB_USER:developer}
    password: ${DB_PASSWORD:01092209}
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: none
      show-sql: false
  flyway:
    locations:
      filesystem: src/test/resources/db/migration
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USER}
    password: ${MAILTRAP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    use-root-path: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  pathsToMatch:
    - /api/**