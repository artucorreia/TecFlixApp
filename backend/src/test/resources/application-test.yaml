website:
  url: http://localhost:4200
email:
  code:
    validation:
      time: 600000000000
security:
  api:
    key: password
  jwt:
    token:
      secret: mySecret
      duration: 43200000
      refresh:
        duration: 604800000
server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    platform: h2
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration/structure
    ignore-migration-patterns: '*:missing'
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    username: user
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true