<main>
  <div class="card flex justify-center">
    <p-stepper [(value)]="activeStep" class="basis-[40rem]" [linear]="true">
      <p-step-list>
        <p-step [value]="1" class="flex flex-row flex-auto gap-2">
          <ng-template
            #content
            let-activateCallback="activateCallback"
            let-value="value"
          >
            <button
              class="bg-transparent border-0 inline-flex flex-col gap-2"
              (click)="activateCallback()"
            >
              <span
                class="rounded-full border-2 w-12 h-12 inline-flex items-center justify-center"
                [ngClass]="{
                  'bg-primary text-primary-contrast border-primary':
                    value <= activeStep,
                  'border-surface': value > activeStep,
                }"
              >
                <i class="pi pi-user"></i>
              </span>
            </button>
          </ng-template>
        </p-step>

        <p-step [value]="2" class="flex flex-row flex-auto gap-2">
          <ng-template
            #content
            let-activateCallback="activateCallback"
            let-value="value"
          >
            <button
              class="bg-transparent border-0 inline-flex flex-col gap-2"
              (click)="activateCallback()"
            >
              <span
                class="rounded-full border-2 w-12 h-12 inline-flex items-center justify-center"
                [ngClass]="{
                  'bg-primary text-primary-contrast border-primary':
                    value <= activeStep,
                  'border-surface': value > activeStep,
                }"
              >
                <i class="pi pi-at"></i>
              </span>
            </button>
          </ng-template>
        </p-step>

        <p-step [value]="3" class="flex flex-row flex-auto gap-2">
          <ng-template
            #content
            let-activateCallback="activateCallback"
            let-value="value"
          >
            <button
              class="bg-transparent border-0 inline-flex flex-col gap-2"
              (click)="activateCallback()"
            >
              <span
                class="rounded-full border-2 w-12 h-12 inline-flex items-center justify-center"
                [ngClass]="{
                  'bg-primary text-primary-contrast border-primary':
                    value <= activeStep,
                  'border-surface': value > activeStep,
                }"
              >
                <i class="pi pi-id-card"></i>
              </span>
            </button>
          </ng-template>
        </p-step>
      </p-step-list>

      <p-step-panels>
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <div
              class="flex flex-col gap-2 mx-auto"
              style="min-height: 16rem; max-width: 20rem"
            >
              <div class="text-center mt-4 mb-4 text-xl font-semibold">
                Crie sua conta
              </div>
              <app-professor-data-form
                [form]="professorDataForm"
              ></app-professor-data-form>
            </div>
            <div class="flex pt-6 justify-end">
              <p-button
                (onClick)="activateCallback(2)"
                label="Próximo"
                icon="pi pi-arrow-right"
                iconPos="right"
                [disabled]="
                  professorDataForm.invalid || professorDataForm.disabled
                "
              />
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <div
              class="flex flex-col gap-2 mx-auto"
              style="min-height: 16rem; max-width: 24rem"
            >
              <div class="text-center mt-4 mb-4 text-xl font-semibold">
                Cadastre suas redes sociais
              </div>
              <div class="flex flex-wrap justify-center gap-4">
                <app-professor-socials-form></app-professor-socials-form>
              </div>
            </div>
            <div class="flex pt-6 justify-between">
              <p-button
                (onClick)="activateCallback(1)"
                label="Anterior"
                severity="secondary"
                icon="pi pi-arrow-left"
              />
              <p-button
                (onClick)="activateCallback(3)"
                (onClick)="registerProfessor()"
                label="Próximo"
                icon="pi pi-arrow-right"
                iconPos="right"
                [disabled]="
                  professorDataForm.invalid || professorDataForm.disabled
                "
              />
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <div
              class="flex flex-col gap-2 mx-auto"
              style="min-height: 16rem; max-width: 24rem"
            >
              <div class="text-center mt-4 mb-4 text-xl font-semibold">
                Estamos criando sua conta de professor
              </div>
              <div class="text-center">
                <img
                  alt="logo"
                  src="https://primefaces.org/cdn/primeng/images/stepper/content.svg"
                />
              </div>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </div>
</main>
